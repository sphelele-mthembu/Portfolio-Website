
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sphelele Mthembu</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #080808;
            color: white;
        }

        .cover {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

            .cover h1 {
                font-size: 60px;
                letter-spacing: 5px;
                margin-bottom: 35px;
            }

        .profile-btn {
            padding: 15px 40px;
            background-color: #00e5ff;
            color: #080808;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

            .profile-btn:hover {
                background-color: white;
                transform: translateY(-3px);
            }

        /* Phone screen */

        @media (max-width: 600px) {

            .cover h1 {
                font-size: 35px;
                letter-spacing: 3px;
            }
        }
    </style>

</head>

<body>

    <div class="cover">

        <h1>SPHELELE MTHEMBU</h1>

        <a href="profile.html" class="profile-btn">
            Profile
        </a>

    </div>

</body>

</html>
